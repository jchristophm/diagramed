<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Diagramed</title><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="style.css"></head>
<body>
<div id="toolbar-top"><button data-action="object" title="Object">Object</button><button data-action="collection" title="Objects">Objects</button><button data-action="edit" title="Edit object">Edit</button><button data-action="vector" title="Vector">Vector</button><button data-action="vectors" title="Vectors">Vectors</button><span id="selected-name"></span></div>
<div id="main-canvas"><div id="container" aria-label="Physics diagram"></div></div>
<div id="toolbar-bottom"><button data-action="open" title="Open JSON">Open</button><button data-action="grid" title="Toggle Grid">Grid</button><button data-action="delete" title="Delete selected object">Delete</button><button data-action="download" title="Download JSON">Save</button></div>
<input id="file-input" type="file" accept=".json,application/json" hidden><p id="status" role="status" aria-live="polite"></p>
<dialog id="object-dialog" aria-labelledby="object-title"><form id="object-form">
<h2 id="object-title">Define object</h2>
<label>Start with <select id="object-preset"><option value="custom">Custom object</option></select></label>
<label>Category <select id="object-category"></select></label>
<label id="polarity-label">Polarity <select id="object-polarity"><option value="positive">Positive</option><option value="negative">Negative</option></select></label>
<label>Name <input id="object-name" required maxlength="120" autocomplete="off"></label>
<label>Representation <select id="object-representation"><option value="circle">Circle</option><option value="rectangle">Rectangle</option><option value="point">Point</option><option value="surface">Surface</option><option value="spring">Spring</option><option value="cable">Cable</option><option value="none">No visible representation</option></select></label>
<p class="hint">All representations describe point-like physical objects.</p>
<div id="property-fields"></div>
<label class="check"><input id="show-name" type="checkbox" checked>Show name label</label>
<label class="check"><input id="show-properties" type="checkbox" checked>Show property symbols</label>
<p id="object-error" role="alert"></p>
<div class="dialog-actions"><button type="button" id="cancel-object">Cancel</button><button type="submit" id="save-object">Create object</button></div>
</form></dialog>
<dialog id="collection-dialog" aria-labelledby="collection-title"><h2 id="collection-title">Objects</h2><p class="hint">Select a name to locate its representation. Hidden objects remain part of the physical model.</p><div id="object-list"></div><div class="dialog-actions"><button id="close-collection">Close</button></div></dialog>
<dialog id="legacy-dialog" aria-labelledby="legacy-title"><form id="legacy-form"><h2 id="legacy-title">Edit legacy label</h2><textarea id="legacy-input" rows="3"></textarea><div id="legacy-preview"></div><div class="dialog-actions"><button type="button" id="cancel-legacy">Cancel</button><button type="submit">Save label</button></div></form></dialog>
<dialog id="vector-dialog"><form id="vector-form"><h2>Define vector</h2>
<label>Vector type <select id="vector-kind"><option value="separation">Separation</option><option value="force">Force</option><option value="field">Field</option><option value="velocity">Velocity</option><option value="acceleration">Acceleration</option><option value="displacement">Displacement</option></select></label>
<label id="interaction-label">Interaction <select id="vector-interaction"><option value="gravitational">Gravitational</option><option value="electric">Electric</option><option value="contact">Contact</option><option value="buoyant">Buoyant</option></select></label>
<label id="contact-label">Contact type <select id="vector-contact"><option value="ordinary">Ordinary contact</option><option value="spring">Spring</option><option value="cable">Cable tension</option></select></label>
<label id="from-label"><span>FROM</span> <select id="vector-from"></select></label><label id="to-label"><span>TO</span> <select id="vector-to"></select></label>
<label id="separation-label">Separation <select id="vector-separation"></select></label>
<div id="magnitude-fields"></div>
<div id="friction-options"><label>Friction <select id="vector-friction"><option value="none">None</option><option value="static">Static</option><option value="kinetic">Kinetic</option></select></label><div id="friction-magnitude"></div><label class="check"><input id="coefficient-enabled" type="checkbox">Define friction coefficient</label><div id="coefficient-fields"></div><label class="check"><input id="resultant-visible" type="checkbox">Show resultant</label><label>Friction graphical length <input id="friction-length" type="number" min="1" max="10000" value="80"></label></div>
<div id="volume-fields"></div>
<div id="direction-fields"><label>Graphical direction (degrees) <input id="vector-angle" type="number" value="-90" step="any"></label><label>Graphical length <input id="vector-length" type="number" min="1" max="10000" value="80" step="any"></label></div>
<label class="check"><input id="vector-visible" type="checkbox" checked>Show vector</label>
<p id="vector-error" role="alert"></p><div class="dialog-actions"><button type="button" id="cancel-vector">Cancel</button><button type="submit" id="save-vector">Save vector</button></div></form></dialog>
<dialog id="vector-collection"><h2>Vectors</h2><div id="vector-list"></div><p id="vector-collection-error" role="alert"></p><button id="close-vectors">Close</button></dialog>
<script type="module" src="/src/main.ts"></script>
</body></html>
